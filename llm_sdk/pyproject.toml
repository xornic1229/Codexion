[project]
name = "llm-sdk"
version = "0.1.0"
description = "Subject-provided Small_LLM_Model wrapper"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.25,<2",
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
